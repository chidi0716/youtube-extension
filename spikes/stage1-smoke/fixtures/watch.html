<!doctype html>
<!--
  本機測試用的「觀看頁」：只模擬工具列與觀看輔助功能需要的結構，依 2026-10-21 實測 YouTube
  的元素層級寫成，內容全部是假的。由 Playwright 的 route 提供，瀏覽器不會連到 YouTube。

  模擬的部分：
  - 標題列（#masthead-container，固定在頂端）；
  - 播放器（#player > ... > #player-container > #movie_player），內含可播放的 <video>
    （/__fixture/test.webm，30 秒）與自動播放開關（.ytp-autonav-toggle-button[aria-checked]）；
  - #movie_player 上的播放器 API（getVideoData、seekTo、getVolume、setVolume 等）；
  - 標題、留言區（#comments）、右側影片清單（站內換頁會發出 yt-navigate-finish）；
  - <html dark> 深色主題與顏色變數，以及模擬 YouTube 選單的「切換主題」按鈕。
  - 主題的實測行為（specs/notes/T06b-dark-mode-instant.md）：
    - YouTube 依載入時的主題輸出不同的樣式表：`:root` 的顏色變數預設值就是載入時的主題，另有
      `[dark]`、`[light]` 兩組覆寫，以及以 `:root:root` 固定的少數變數（這裡是「訂閱」按鈕的文字色）；
    - 頂端列（ytd-masthead[dark][page-dark-theme]）與 ytd-watch-flexy[is-dark-theme] 的屬性依載入時的主題設定；
    - 站內換頁時，依記憶中（載入時）的主題把頂端列的 dark 改回去，並以記憶中的偏好改寫 PREF（另加 f7=100）。
  - 網址帶 fixture_static_theme=1 時不輸出 [dark]／[light] 覆寫，模擬「只切換屬性無法改變顏色」
    （用來測試退回重新載入，003 FR-16）。
-->
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Fixture watch page</title>
    <script>
      // 模擬 YouTube 依 PREF cookie 的 f6 旗標決定主題（實測：0x400 深色、0x80000 淺色）。
      // 兩者都沒有時模擬「使用裝置主題」：依 prefers-color-scheme（假設，真實行為見 T06a 筆記）。
      (function () {
        const pref = document.cookie.split('; ').find((c) => c.startsWith('PREF='));
        const f6 = pref && /(?:^|&)f6=([0-9a-fA-F]+)/.exec(pref.slice(5));
        const flags = f6 ? parseInt(f6[1], 16) : 0;
        const dark =
          flags & 0x400 ? true : flags & 0x80000 ? false : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.setAttribute('dark', '');
        // 模擬 YouTube 記憶中的主題與偏好（站內換頁時用來改回去）
        window.__fixtureLoadDark = dark;
        window.__fixtureThemeMemoryDark = dark;
        window.__fixturePrefMemory = pref ? pref.slice(5) : '';

        const lightVars = {
          'text-primary': '#0f0f0f',
          'text-secondary': '#606060',
          'menu-background': '#fff',
          'base-background': '#fff',
          'additive-background': 'rgba(0, 0, 0, 0.05)',
          'button-chip-background-hover': 'rgba(0, 0, 0, 0.1)',
          'call-to-action': '#065fd4',
          outline: 'rgba(0, 0, 0, 0.1)',
          'text-primary-inverse': '#fff',
          'text-disabled': '#909090',
        };
        const darkVars = {
          'text-primary': '#f1f1f1',
          'text-secondary': '#aaa',
          'menu-background': '#282828',
          'base-background': '#0f0f0f',
          'additive-background': 'rgba(255, 255, 255, 0.1)',
          'button-chip-background-hover': 'rgba(255, 255, 255, 0.2)',
          'call-to-action': '#3ea6ff',
          outline: 'rgba(255, 255, 255, 0.2)',
          'text-primary-inverse': '#0f0f0f',
          'text-disabled': '#717171',
        };
        const decl = (vars) =>
          Object.entries(vars)
            .map(([k, v]) => `--yt-sys-color-baseline--${k}: ${v};`)
            .join(' ');
        let css = `:root { ${decl(dark ? darkVars : lightVars)} }`;
        css += ` :root:root { --fixture-pinned-inverse: ${dark ? '#0f0f0f' : '#f1f1f1'}; }`;
        if (new URL(location.href).searchParams.get('fixture_static_theme') !== '1') {
          css += ` [dark] { ${decl(darkVars)} --fixture-pinned-inverse: #0f0f0f; }`;
          css += ` [light] { ${decl(lightVars)} --fixture-pinned-inverse: #fff; }`;
        }
        const style = document.createElement('style');
        style.id = 'fixture-load-theme';
        style.textContent = css;
        document.head.appendChild(style);
      })();
    </script>
    <style>
      html {
        font-family: Roboto, Arial, sans-serif;
        background: var(--yt-sys-color-baseline--base-background);
        color: var(--yt-sys-color-baseline--text-primary);
      }
      ytd-masthead {
        display: flex;
        align-items: center;
        gap: 16px;
        height: 100%;
      }
      /* 頂端列的部分顏色依 ytd-masthead[dark] 決定（實測：搜尋框） */
      #fixture-search {
        padding: 2px 12px;
        border: 1px solid #ccc;
        border-radius: 12px;
        color: #0f0f0f;
      }
      ytd-masthead[dark] #fixture-search {
        border-color: #303030;
        color: #f1f1f1;
      }
      /* 觀看頁的部分顏色依 ytd-watch-flexy[is-dark-theme] 決定 */
      #fixture-description {
        margin-top: 12px;
        padding: 12px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.05);
      }
      ytd-watch-flexy[is-dark-theme] #fixture-description {
        background: rgba(255, 255, 255, 0.1);
      }
      /* 「訂閱」按鈕：背景隨 [dark]／[light]，文字色是被 :root:root 固定的變數 */
      #fixture-subscribe {
        margin-top: 8px;
        padding: 8px 16px;
        border: 0;
        border-radius: 18px;
        background: var(--yt-sys-color-baseline--text-primary);
        color: var(--fixture-pinned-inverse);
        font: inherit;
      }
      body {
        margin: 0;
      }
      ytd-app,
      ytd-watch-flexy,
      ytd-watch-metadata,
      ytd-player,
      ytd-comments {
        display: block;
      }
      #masthead-container {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 2020;
        height: 56px;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 16px;
        background: var(--yt-sys-color-baseline--base-background);
      }
      #page-manager {
        padding-top: 56px;
      }
      #columns {
        display: flex;
        gap: 24px;
        padding: 24px;
      }
      #primary {
        flex: 1;
        min-width: 0;
      }
      #secondary {
        width: 360px;
      }
      #player-container-inner {
        position: relative;
        padding-top: 56.25%;
      }
      #player-container {
        position: absolute;
        inset: 0;
      }
      ytd-player,
      ytd-player #container,
      #movie_player {
        width: 100%;
        height: 100%;
      }
      #movie_player {
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        background: #000;
      }
      .html5-video-container,
      .html5-main-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .ytp-chrome-bottom {
        position: absolute;
        right: 12px;
        bottom: 12px;
        z-index: 10;
        display: flex;
        gap: 8px;
      }
      .ytp-button {
        padding: 4px 8px;
        border: 0;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font: inherit;
        font-size: 12px;
      }
      .ytp-autonav-toggle-button {
        display: inline-block;
        width: 28px;
        height: 12px;
        margin-left: 4px;
        border-radius: 6px;
        background: #717171;
        vertical-align: middle;
      }
      .ytp-autonav-toggle-button[aria-checked='true'] {
        background: #fff;
      }
      h1 {
        margin: 12px 0 0;
        font-size: 20px;
      }
      #comments {
        margin-top: 24px;
        padding: 16px;
        border: 1px dashed var(--yt-sys-color-baseline--outline);
      }
      .filler {
        height: 1600px;
      }
      #secondary a {
        display: block;
        margin-bottom: 8px;
        color: var(--yt-sys-color-baseline--call-to-action);
      }
    </style>
  </head>
  <body>
    <ytd-app>
      <div id="masthead-container">
        <ytd-masthead id="masthead">
          <strong>Fixture</strong>
          <span id="fixture-search">Search</span>
          <button id="fixture-theme-toggle" type="button">Theme (YouTube menu)</button>
        </ytd-masthead>
      </div>
      <div id="page-manager">
        <ytd-watch-flexy>
          <div id="columns">
            <div id="primary">
              <div id="primary-inner">
                <div id="player">
                  <div id="player-container-outer">
                    <div id="player-container-inner">
                      <div id="player-container">
                        <ytd-player id="ytd-player">
                          <div id="container">
                            <div id="movie_player" class="html5-video-player">
                              <div class="html5-video-container">
                                <video class="html5-main-video" src="/__fixture/test.webm" preload="auto" playsinline></video>
                              </div>
                              <div class="ytp-chrome-bottom">
                                <button class="ytp-button" id="fixture-play" type="button">Play/Pause</button>
                                <button class="ytp-button" data-tooltip-target-id="ytp-autonav-toggle-button" type="button">
                                  Autoplay<span class="ytp-autonav-toggle-button" aria-checked="true"></span>
                                </button>
                              </div>
                            </div>
                          </div>
                        </ytd-player>
                      </div>
                    </div>
                  </div>
                </div>
                <div id="below">
                  <div id="shopping-timely-shelf"></div>
                  <div>
                    <ytd-watch-metadata>
                      <div id="title"><h1>Fixture video</h1></div>
                      <button id="fixture-subscribe" type="button">Subscribe</button>
                      <div id="fixture-description">Description (fixture)</div>
                    </ytd-watch-metadata>
                  </div>
                  <ytd-comments id="comments"><p id="fixture-comments-text">Comments section (fixture)</p></ytd-comments>
                  <div class="filler"></div>
                </div>
              </div>
            </div>
            <div id="secondary">
              <a id="next" href="/watch?v=aaaaaaaaaaa">Next video</a>
              <a id="next2" href="/watch?v=bbbbbbbbbbb">Another video</a>
            </div>
          </div>
        </ytd-watch-flexy>
      </div>
    </ytd-app>
    <script>
      const player = document.getElementById('movie_player');
      const video = player.querySelector('video');
      const autonav = player.querySelector('.ytp-autonav-toggle-button');

      // 模擬 YouTube 播放器 API（只有頁面橋接腳本會用到的方法）。
      const videoId = () => new URL(location.href).searchParams.get('v');
      player.getVideoData = () => ({ video_id: videoId(), title: document.querySelector('h1').textContent, isLive: false });
      player.getPlayerResponse = () => ({ videoDetails: { isLive: false, isUpcoming: false, lengthSeconds: '30' } });
      player.getDuration = () => video.duration;
      player.getCurrentTime = () => video.currentTime;
      player.seekTo = (s) => {
        video.currentTime = s;
      };
      player.getVolume = () => Math.round(video.volume * 100);
      player.setVolume = (v) => {
        video.volume = Math.max(0, Math.min(100, v)) / 100;
      };
      player.isMuted = () => video.muted;
      player.unMute = () => {
        video.muted = false;
      };

      document.getElementById('fixture-play').addEventListener('click', () => (video.paused ? video.play() : video.pause()));

      // 自動播放開關：點按鈕切換 aria-checked。
      autonav.closest('button').addEventListener('click', () => {
        autonav.setAttribute('aria-checked', String(autonav.getAttribute('aria-checked') !== 'true'));
      });

      // 模擬 YouTube 依載入時的主題設定在元素上的主題屬性。
      const masthead = document.getElementById('masthead');
      const flexy = document.querySelector('ytd-watch-flexy');
      const setElementTheme = (dark) => {
        masthead.toggleAttribute('dark', dark);
        masthead.toggleAttribute('page-dark-theme', dark);
        flexy.toggleAttribute('is-dark-theme', dark);
      };
      setElementTheme(window.__fixtureLoadDark);
      const writePref = (value) => {
        document.cookie = 'PREF=' + value + '; domain=.youtube.com; path=/; max-age=34560000; secure; samesite=lax';
      };

      // 模擬使用者從 YouTube 選單切換主題（假設可即時切換，例如登入帳號）：改寫 PREF 的 f6 旗標並立即套用。
      // （未登入時真實的 YouTube 選單會重新載入頁面，見 T06b 筆記。）
      document.getElementById('fixture-theme-toggle').addEventListener('click', () => {
        const dark = !document.documentElement.hasAttribute('dark');
        const pref = (document.cookie.split('; ').find((c) => c.startsWith('PREF=')) || 'PREF=').slice(5);
        const fields = pref ? pref.split('&').map((p) => p.split('=')) : [];
        const i = fields.findIndex(([k]) => k === 'f6');
        const flags = i === -1 ? 0 : parseInt(fields[i][1], 16);
        const next = ((flags & ~0x80400) | (dark ? 0x400 : 0x80000)).toString(16);
        if (i === -1) fields.push(['f6', next]);
        else fields[i] = ['f6', next];
        const value = fields.map((f) => f.join('=')).join('&');
        writePref(value);
        window.__fixturePrefMemory = value;
        window.__fixtureThemeMemoryDark = dark;
        document.documentElement.toggleAttribute('dark', dark);
        document.documentElement.toggleAttribute('light', !dark && window.__fixtureLoadDark);
        setElementTheme(dark);
      });

      // 模擬站內換頁時 YouTube 依記憶中的狀態改回主題：頂端列的 dark 屬性，以及以記憶中的偏好
      // 改寫 PREF（實測會另外加上 f7=100，主題旗標是舊的）。
      const simulateStaleTheme = () => {
        masthead.toggleAttribute('dark', window.__fixtureThemeMemoryDark);
        const fields = window.__fixturePrefMemory ? window.__fixturePrefMemory.split('&').map((p) => p.split('=')) : [];
        if (!fields.some(([k]) => k === 'f7')) fields.push(['f7', '100']);
        window.__fixturePrefMemory = fields.map((f) => f.join('=')).join('&');
        writePref(window.__fixturePrefMemory);
      };

      // 模擬 YouTube 的 t 參數：載入後跳到指定的秒數。
      const startAt = /^(\d+)s?$/.exec(new URL(location.href).searchParams.get('t') || '');
      if (startAt) {
        if (video.readyState >= 1) video.currentTime = Number(startAt[1]);
        else video.addEventListener('loadedmetadata', () => (video.currentTime = Number(startAt[1])), { once: true });
      }

      // 模擬 YouTube 的站內換頁：改網址並發出 yt-navigate-finish。
      for (const a of document.querySelectorAll('#secondary a')) {
        a.addEventListener('click', (e) => {
          e.preventDefault();
          history.pushState({}, '', e.currentTarget.getAttribute('href'));
          document.querySelector('h1').textContent = 'Fixture video ' + videoId();
          video.currentTime = 0;
          simulateStaleTheme();
          document.dispatchEvent(new CustomEvent('yt-navigate-finish'));
        });
      }
    </script>
  </body>
</html>
