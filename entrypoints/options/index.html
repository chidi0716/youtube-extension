<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__MSG_optionsTitle__</title>
    <!-- 設定頁以獨立分頁開啟。偏好設定集中在這裡，依類別分組（constitution 第 7a 點）。 -->
    <meta name="manifest.open_in_tab" content="true" />
  </head>
  <body>
    <main id="app">
      <h1 data-i18n="optionsTitle"></h1>

      <!-- 介面語言（007）：內容由 main.ts 繪製。 -->
      <section id="language" class="section" aria-labelledby="language-title">
        <h2 id="language-title" data-i18n="optionsLanguageTitle"></h2>
        <div id="language-groups"></div>
      </section>

      <!-- 工具列（006 FR-2、FR-22）：內容由 toolbar.ts 繪製。 -->
      <section id="toolbar" class="section" aria-labelledby="toolbar-title">
        <h2 id="toolbar-title" data-i18n="optionsToolbarTitle"></h2>
        <p class="section-desc" data-i18n="optionsToolbarDesc"></p>
        <div id="toolbar-groups"></div>
      </section>

      <!-- 頁面整理（005）：類別與選項由 main.ts 依 features/tidy/options.ts 繪製。 -->
      <section id="tidy" class="section" aria-labelledby="tidy-title">
        <h2 id="tidy-title" data-i18n="optionsTidyTitle"></h2>
        <p class="section-desc" data-i18n="optionsTidyDesc"></p>
        <div id="tidy-groups"></div>
      </section>

      <!-- 下載（002 FR-60、004 FR-11）：內容由 downloads.ts 繪製。 -->
      <section id="downloads" class="section" aria-labelledby="downloads-title">
        <h2 id="downloads-title" data-i18n="optionsDownloadsTitle"></h2>
        <p class="section-desc" data-i18n="optionsDownloadsDesc"></p>
        <div id="downloads-groups"></div>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
